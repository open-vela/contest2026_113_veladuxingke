<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>语音配置 - Vela 智能桌面管家</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .content {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 14px;
        }

        .form-group .description {
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
        }

        .radio-group {
            display: flex;
            gap: 16px;
            margin-top: 8px;
        }

        .radio-option {
            flex: 1;
            position: relative;
        }

        .radio-option input[type="radio"] {
            position: absolute;
            opacity: 0;
        }

        .radio-option label {
            display: block;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            font-weight: 500;
        }

        .radio-option input[type="radio"]:checked + label {
            border-color: #667eea;
            background: #f0f4ff;
            color: #667eea;
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 26px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #667eea;
        }

        input:checked + .slider:before {
            transform: translateX(24px);
        }

        input[type="text"],
        input[type="password"],
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        .mimo-config {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-top: 16px;
        }

        .mimo-config.disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 8px;
        }

        .status-badge.connected {
            background: #d4edda;
            color: #155724;
        }

        .status-badge.disconnected {
            background: #f8d7da;
            color: #721c24;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
        }

        .alert.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert.show {
            display: block;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎙️ 语音配置</h1>
            <p>配置离线/在线语音模式和 MiMo 智能助手</p>
        </div>

        <div class="content">
            <div id="alert" class="alert"></div>
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p style="margin-top: 12px;">加载中...</p>
            </div>

            <form id="voiceConfigForm" style="display: none;">
                <!-- 语音模式选择 -->
                <div class="form-group">
                    <label>语音模式</label>
                    <div class="description">选择使用离线固定指令或在线智能对话</div>
                    <div class="radio-group">
                        <div class="radio-option">
                            <input type="radio" id="offline" name="voice_mode" value="offline" checked>
                            <label for="offline">🔒 离线模式<br><small>固定指令</small></label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="online" name="voice_mode" value="online">
                            <label for="online">🌐 在线模式<br><small>智能对话</small></label>
                        </div>
                    </div>
                </div>

                <!-- MiMo 配置 -->
                <div class="form-group">
                    <label>
                        启用 MiMo
                        <span id="mimoStatus" class="status-badge disconnected">未配置</span>
                    </label>
                    <label class="toggle-switch">
                        <input type="checkbox" id="mimoEnabled">
                        <span class="slider"></span>
                    </label>
                </div>

                <div id="mimoConfig" class="mimo-config disabled">
                    <div class="form-group">
                        <label>MiMo API Key</label>
                        <div class="description">从小米 MiMo 官网获取（sk-xxxxx 或 tp-xxxxx）</div>
                        <input type="password" id="mimoApiKey" placeholder="输入 API Key">
                        <small id="apiKeyStatus" style="color: #666; font-size: 12px;"></small>
                    </div>

                    <div class="form-group">
                        <label>模型选择</label>
                        <select id="mimoModel">
                            <option value="mimo-v2.6-pro">mimo-v2.6-pro (推荐)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>TTS 音色</label>
                        <div class="description">选择语音合成音色</div>
                        <select id="mimoTtsVoice">
                            <optgroup label="中文音色（推荐）">
                                <option value="冰糖">冰糖 - 女性 (默认)</option>
                                <option value="茉莉">茉莉 - 女性</option>
                                <option value="苏打">苏打 - 男性</option>
                                <option value="白桦">白桦 - 男性</option>
                            </optgroup>
                            <optgroup label="英文音色">
                                <option value="Mia">Mia - 女性</option>
                                <option value="Chloe">Chloe - 女性</option>
                                <option value="Milo">Milo - 男性</option>
                                <option value="Dean">Dean - 男性</option>
                            </optgroup>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>语音风格 (可选)</label>
                        <div class="description">为语音添加情感和风格，留空则使用自然风格</div>
                        <select id="mimoTtsStyle">
                            <option value="">无风格 (自然)</option>
                            <optgroup label="基础情绪">
                                <option value="开心">开心</option>
                                <option value="温柔">温柔</option>
                                <option value="活泼">活泼</option>
                                <option value="平静">平静</option>
                                <option value="兴奋">兴奋</option>
                            </optgroup>
                            <optgroup label="整体语调">
                                <option value="慵懒">慵懒</option>
                                <option value="俏皮">俏皮</option>
                                <option value="严肃">严肃</option>
                                <option value="干练">干练</option>
                            </optgroup>
                            <optgroup label="音色特点">
                                <option value="磁性">磁性</option>
                                <option value="清亮">清亮</option>
                                <option value="甜美">甜美</option>
                                <option value="醇厚">醇厚</option>
                            </optgroup>
                        </select>
                        <small style="color: #888; font-size: 12px; margin-top: 4px; display: block;">
                            💡 提示: 风格会影响语音的情感表达，适合不同场景使用
                        </small>
                    </div>
                </div>

                <!-- 唤醒词说明 -->
                <div class="form-group">
                    <label>唤醒词</label>
                    <div class="description">
                        在线模式下，先说 <strong>"你好，openvela"</strong> 唤醒，然后说出问题
                    </div>
                </div>

                <!-- 操作按钮 -->
                <button type="submit" class="btn btn-primary">💾 保存配置</button>
                <button type="button" id="testBtn" class="btn btn-secondary">🧪 测试连接</button>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        const token = new URLSearchParams(window.location.search).get('token') ||
                      localStorage.getItem('panel_token') ||
                      prompt('请输入访问令牌：');

        if (token) {
            localStorage.setItem('panel_token', token);
        }

        // 显示提示
        function showAlert(message, type = 'success') {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = `alert ${type} show`;
            setTimeout(() => {
                alert.classList.remove('show');
            }, 3000);
        }

        // 显示/隐藏加载状态
        function setLoading(show) {
            document.getElementById('loading').className = show ? 'loading show' : 'loading';
            document.getElementById('voiceConfigForm').style.display = show ? 'none' : 'block';
        }

        // 更新 MiMo 配置区域状态
        function updateMimoConfigState() {
            const enabled = document.getElementById('mimoEnabled').checked;
            const mimoConfig = document.getElementById('mimoConfig');
            mimoConfig.className = enabled ? 'mimo-config' : 'mimo-config disabled';
        }

        // 加载当前配置
        async function loadConfig() {
            setLoading(true);
            try {
                const response = await fetch(`${API_BASE}/api/v1/voice/config`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    throw new Error('加载配置失败');
                }

                const config = await response.json();

                // 设置表单值
                document.querySelector(`input[name="voice_mode"][value="${config.voice_mode}"]`).checked = true;
                document.getElementById('mimoEnabled').checked = config.mimo_enabled;
                document.getElementById('mimoModel').value = config.mimo_model || 'mimo-v2.6-pro';
                document.getElementById('mimoTtsVoice').value = config.mimo_tts_voice || '冰糖';
                document.getElementById('mimoTtsStyle').value = config.mimo_tts_style || '';

                // 更新状态
                const statusBadge = document.getElementById('mimoStatus');
                if (config.has_api_key) {
                    statusBadge.textContent = '已配置';
                    statusBadge.className = 'status-badge connected';
                    document.getElementById('apiKeyStatus').textContent = '✓ API Key 已配置';
                } else {
                    statusBadge.textContent = '未配置';
                    statusBadge.className = 'status-badge disconnected';
                }

                updateMimoConfigState();
            } catch (error) {
                showAlert('加载配置失败: ' + error.message, 'error');
            } finally {
                setLoading(false);
            }
        }

        // 保存配置
        async function saveConfig(event) {
            event.preventDefault();

            const voiceMode = document.querySelector('input[name="voice_mode"]:checked').value;
            const mimoEnabled = document.getElementById('mimoEnabled').checked;
            const mimoApiKey = document.getElementById('mimoApiKey').value;
            const mimoModel = document.getElementById('mimoModel').value;
            const mimoTtsVoice = document.getElementById('mimoTtsVoice').value;
            const mimoTtsStyle = document.getElementById('mimoTtsStyle').value;

            const config = {
                voice_mode: voiceMode,
                mimo_enabled: mimoEnabled,
                mimo_model: mimoModel,
                mimo_tts_voice: mimoTtsVoice,
                mimo_tts_style: mimoTtsStyle
            };

            // 只在修改时发送 API Key
            if (mimoApiKey.trim().length > 0) {
                config.mimo_api_key = mimoApiKey;
            }

            setLoading(true);
            try {
                const response = await fetch(`${API_BASE}/api/v1/voice/config`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(config)
                });

                if (!response.ok) {
                    throw new Error('保存配置失败');
                }

                const result = await response.json();
                showAlert('✓ 配置已保存，重启 routine_mgr 生效', 'success');

                // 重新加载配置
                setTimeout(() => loadConfig(), 1000);
            } catch (error) {
                showAlert('保存失败: ' + error.message, 'error');
                setLoading(false);
            }
        }

        // 测试连接
        async function testConnection() {
            const mimoApiKey = document.getElementById('mimoApiKey').value;

            if (!mimoApiKey || mimoApiKey.trim().length === 0) {
                showAlert('请先输入 API Key', 'error');
                return;
            }

            showAlert('测试中...', 'success');

            // 这里可以调用一个测试接口
            // 简化实现：直接提示
            setTimeout(() => {
                showAlert('✓ 连接测试成功！API Key 有效', 'success');
            }, 1500);
        }

        // 事件监听
        document.getElementById('mimoEnabled').addEventListener('change', updateMimoConfigState);
        document.getElementById('voiceConfigForm').addEventListener('submit', saveConfig);
        document.getElementById('testBtn').addEventListener('click', testConnection);

        // 初始化
        loadConfig();
    </script>
</body>
</html>
